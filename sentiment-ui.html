<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sentiment Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 16px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #357abd;
    }

    #result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      display: none;
    }

    /* Color changes based on sentiment */
    .positive { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .negative { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .neutral  { background: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }

    #error {
      margin-top: 16px;
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🧠 Sentiment Analyzer</h1>

  <textarea id="reviewInput" placeholder="Type or paste a product review here..."></textarea>

  <button onclick="analyzeSentiment()">Analyze Sentiment</button>

  <div id="result"></div>
  <div id="error"></div>

  <script>
    // ---- CHANGE THIS TO YOUR NGROK URL IF TESTING REMOTELY ----
    const API_URL = "https://carefully-stegosaur-ranting.ngrok-free.dev";

    async function analyzeSentiment() {
      const text = document.getElementById("reviewInput").value.trim();
      const resultDiv = document.getElementById("result");
      const errorDiv = document.getElementById("error");

      // Clear previous results
      resultDiv.style.display = "none";
      errorDiv.textContent = "";

      if (!text) {
        errorDiv.textContent = "Please enter a review before analyzing.";
        return;
      }

      try {
        const response = await fetch(`${API_URL}/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ review_text: text }),
        });

        const data = await response.json();

        // Show the result box
        resultDiv.style.display = "block";
        resultDiv.textContent = `${data.sentiment} — Confidence: ${data.confidence}`;

        // Apply color based on sentiment
        resultDiv.className = ""; // reset classes
        const label = data.sentiment.split(" ")[0].toLowerCase(); // "positive", "negative", "neutral"
        resultDiv.classList.add(label);

      } catch (err) {
        errorDiv.textContent = "Error connecting to API. Make sure the server is running.";
      }
    }
  </script>

</body>
</html>
